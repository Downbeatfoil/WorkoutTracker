<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101214" />
    <title>Workout Tracker</title>
    <link rel="manifest" href="manifest.webmanifest?v=13" />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header" id="appHeader" hidden>
        <div>
          <p class="label">Workout</p>
          <h1>Tracker</h1>
        </div>
        <button class="icon-button" id="installButton" type="button" title="Install app" hidden>+</button>
      </header>

      <main>
        <section id="homeView" class="home-view" aria-label="Workout days">
          <nav id="dayButtons" class="home-buttons" aria-label="Workout days"></nav>
        </section>

        <section id="workoutView" class="stack" hidden>
          <div class="workout-topbar">
            <button class="back-button" id="backButton" type="button">Days</button>
            <div>
              <p class="label">Today</p>
              <h2 id="workoutTitle">Tuesday Workout</h2>
            </div>
          </div>

          <div id="activeTimers" class="active-timers" aria-live="polite"></div>
          <div id="exerciseList" class="exercise-list"></div>
        </section>

        <section id="progressView" class="stack" hidden>
          <div class="workout-topbar">
            <button class="back-button" id="progressBackButton" type="button">Days</button>
            <div>
              <p class="label">Progress</p>
              <h2>1RM Graphs</h2>
            </div>
          </div>
          <div id="progressList" class="progress-list"></div>
        </section>
      </main>
    </div>

    <template id="exerciseTemplate">
      <article class="exercise-card">
        <div class="exercise-header">
          <div>
            <h3 class="exercise-name"></h3>
            <p class="exercise-meta"></p>
          </div>
          <button class="rest-pill" type="button">03:30</button>
        </div>

        <div class="last-grid">
          <div>
            <span>Last reps</span>
            <strong class="last-reps">--</strong>
          </div>
          <div>
            <span>Last weight</span>
            <strong class="last-weight">--</strong>
          </div>
          <div>
            <span>Last 1RM</span>
            <strong class="last-one-rep-max">--</strong>
          </div>
        </div>

        <div class="max-grid">
          <label class="field">
            <span>Reps</span>
            <input class="draft-reps" type="number" min="1" step="1" inputmode="numeric" placeholder="0" />
          </label>
          <label class="field">
            <span>Weight</span>
            <input class="draft-weight" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" />
          </label>
          <div class="estimate">
            <span>Today 1RM</span>
            <strong class="draft-one-rep-max">--</strong>
          </div>
        </div>

        <p class="draft-status"></p>
        <p class="best-max"></p>
        <div class="notes"></div>
      </article>
    </template>

    <script src="app.js?v=13"></script>
  </body>
</html>
